# ATLAS V5 local-only optional platform overlay.
# Start: docker compose -f compose.yaml -f compose.platform.yaml up -d --build --wait
# Do not combine with compose.production.yaml or expose these ports publicly.
services:
  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - atlas_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 20
    restart: unless-stopped
  kafka:
    image: apache/kafka:4.1.1
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_LOG_DIRS: "/var/lib/kafka/data"
      KAFKA_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    volumes:
      - atlas_kafka:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 8s
      retries: 30
    restart: unless-stopped
  topic-init:
    image: apache/kafka:4.1.1
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic atlas.audit.v1 --partitions 3 --replication-factor 1
    restart: "no"
  init:
    environment:
      ATLAS_PLATFORM_LOCAL: YES_ISOLATED_LOCAL
    command:
      - sh
      - -ec
      - |
        php artisan migrate --force
        if [ "$SEED_DEMO" = true ]; then php artisan db:seed --force; fi
        php artisan platform:outbox:enable-local
  backend:
    environment:
      CACHE_STORE: redis
      REDIS_CLIENT: phpredis
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_CACHE_CONNECTION: cache
      QUEUE_CONNECTION: database
      SESSION_DRIVER: database
    depends_on:
      redis: { condition: service_healthy }
  publisher:
    build: ./platform
    environment: &platform-env
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: atlas
      DB_USER: atlas
      DB_PASSWORD: ${DB_PASSWORD:?Initialize .env with node scripts/setup.mjs}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TOPIC: atlas.audit.v1
    command: ["python", "-m", "atlas_platform.publisher"]
    depends_on:
      db: { condition: service_healthy }
      topic-init: { condition: service_completed_successfully }
      init: { condition: service_completed_successfully }
    restart: unless-stopped
  consumer:
    build: ./platform
    environment:
      <<: *platform-env
      KAFKA_GROUP_ID: atlas-platform-analytics-v1
    command: ["python", "-m", "atlas_platform.consumer"]
    depends_on:
      db: { condition: service_healthy }
      topic-init: { condition: service_completed_successfully }
      init: { condition: service_completed_successfully }
    restart: unless-stopped
volumes:
  atlas_redis:
  atlas_kafka:
