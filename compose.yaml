name: atlas-erp-lite
x-backend-env: &backend-env
  DB_CONNECTION: pgsql
  DB_HOST: db
  DB_PORT: 5432
  DB_DATABASE: atlas
  DB_USERNAME: atlas
  DB_PASSWORD: ${DB_PASSWORD:?Run node scripts/setup.mjs first}
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: atlas
      POSTGRES_USER: atlas
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Run node scripts/setup.mjs first}
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atlas -d atlas"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  init:
    image: atlas-erp-lite-backend:local
    build: ./backend
    env_file: .env
    environment: *backend-env
    depends_on:
      db: {condition: service_healthy}
    command: ["sh", "-c", "php artisan migrate --force && if [ \"$$SEED_DEMO\" = true ]; then php artisan db:seed --force; fi"]
  backend:
    image: atlas-erp-lite-backend:local
    build: ./backend
    env_file: .env
    environment: *backend-env
    depends_on:
      init: {condition: service_completed_successfully}
    restart: unless-stopped
  api-web:
    image: nginx:1.28-alpine
    volumes: ["./infra/nginx/api.conf:/etc/nginx/conf.d/default.conf:ro"]
    ports: ["127.0.0.1:${API_PORT:-8000}:80"]
    depends_on: [backend]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/up"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped
  frontend:
    image: atlas-erp-lite-frontend:local
    build:
      context: ./frontend
      args: {API_INTERNAL_URL: "http://api-web"}
    ports: ["127.0.0.1:${WEB_PORT:-3100}:3000"]
    depends_on:
      api-web: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
    restart: unless-stopped
volumes:
  pgdata:
