name: ATLAS V5 local platform contract
on:
  pull_request:
    paths:
      - 'platform/**'
      - 'compose.platform.yaml'
      - 'backend/Dockerfile'
      - 'backend/database/migrations/2026_11_22_000011_create_platform_event_outbox.php'
      - 'backend/routes/console.php'
      - 'frontend/src/components/layout/WorkspaceSidebar.tsx'
      - '.github/workflows/platform-core.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: atlas-platform-${{ github.ref }}
  cancel-in-progress: true
jobs:
  platform:
    name: Redis Kafka Python end-to-end
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      COMPOSE_PROJECT_NAME: atlas-platform-${{ github.run_id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Python contract tests
        run: |
          python -m pip install --disable-pip-version-check -r platform/requirements.txt
          python -m compileall -q platform
          python -m unittest discover -s platform/tests -v
      - name: Oracle JET gateway regression
        run: node --test jet-industrial/tests/gateway.test.mjs
      - name: Initialize disposable local stack
        run: |
          node scripts/setup.mjs
          docker compose -f compose.yaml -f compose.platform.yaml config --quiet
          docker compose -f compose.yaml -f compose.platform.yaml up -d --build --wait --wait-timeout 300
      - name: Redis and PHP extension probe
        run: |
          docker compose -f compose.yaml -f compose.platform.yaml exec -T backend php -r '
            if (!extension_loaded("redis")) exit(1);
            $r = new Redis();
            if (!$r->connect("redis", 6379, 3)) exit(2);
            if (!$r->set("atlas:ci:ping", "ok", 30)) exit(3);
            if ($r->get("atlas:ci:ping") !== "ok") exit(4);
          '
      - name: PostgreSQL outbox to Kafka to Python receipts
        run: |
          docker compose -f compose.yaml -f compose.platform.yaml run --rm \
            -e ATLAS_PLATFORM_SMOKE=YES_ISOLATED_LOCAL \
            publisher python -m atlas_platform.smoke
      - name: Preserve infrastructure logs
        if: always()
        run: |
          docker compose -f compose.yaml -f compose.platform.yaml logs --no-color > platform-compose.log 2>&1 || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: platform-compose-log
          path: platform-compose.log
          retention-days: 7
      - name: Cleanup disposable platform
        if: always()
        run: docker compose -f compose.yaml -f compose.platform.yaml down -v --remove-orphans || true
