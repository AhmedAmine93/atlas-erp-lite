name: CI and images
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    name: Tests and production images
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      COMPOSE_PROJECT_NAME: atlas-ci-${{ github.run_id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Validate deployment scripts
        run: |
          bash -n scripts/ci.sh scripts/deploy.sh scripts/rehearse-f14.sh scripts/verify-rc1.sh scripts/verify-f17.sh scripts/verify-f18.sh scripts/verify-f19.sh scripts/verify-f20.sh
          shellcheck scripts/ci.sh scripts/deploy.sh scripts/rehearse-f14.sh scripts/verify-rc1.sh
      - name: Build, PostgreSQL, concurrency, HTTP and browser tests
        run: bash scripts/ci.sh
      - name: Preserve test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-reports
          path: |
            reports/
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 14
      - name: Export the exact tested images
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: docker save -o images.tar atlas-erp-lite-backend:local atlas-erp-lite-frontend:local
      - name: Transfer tested images
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tested-images
          path: images.tar
          retention-days: 1
          compression-level: 0
  publish:
    name: Publish tested images
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: tested-images
      - name: Publish without rebuilding
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          registry="ghcr.io/${GITHUB_REPOSITORY,,}"
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          trap 'docker logout ghcr.io' EXIT
          docker load -i images.tar
          mkdir release
          printf 'RELEASE_SHA=%s\n' "$GITHUB_SHA" > release/release.env
          for component in backend frontend; do
            image="$registry-$component"
            docker tag "atlas-erp-lite-$component:local" "$image:sha-$GITHUB_SHA"
            docker push "$image:sha-$GITHUB_SHA"
            digest=$(docker inspect --format '{{index .RepoDigests 0}}' "$image:sha-$GITHUB_SHA")
            printf '%s_IMAGE=%s\n' "${component^^}" "$digest" >> release/release.env
          done
          cat release/release.env >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release
          path: release/release.env
          retention-days: 90
