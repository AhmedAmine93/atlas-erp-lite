name: Deploy tested release
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful CI and images run ID from main
        required: true
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: deploy-demo
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: demo
    env:
      GH_TOKEN: ${{ github.token }}
      RUN_ID: ${{ inputs.run_id }}
      DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
      DEPLOY_USER: ${{ vars.DEPLOY_USER }}
      SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
    steps:
      - name: Verify configuration and release provenance
        id: release
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RUN_ID" =~ ^[0-9]+$ ]]
          test -n "$DEPLOY_HOST" && test -n "$DEPLOY_USER"
          test -n "$SSH_KNOWN_HOSTS" && test -n "$SSH_PRIVATE_KEY"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" > run.json
          jq -e '.conclusion == "success" and .event == "push" and .head_branch == "main" and .path == ".github/workflows/ci.yml"' run.json
          sha=$(jq -r .head_sha run.json)
          [[ "$sha" =~ ^[a-f0-9]{40}$ ]]
          printf 'sha=%s\n' "$sha" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.release.outputs.sha }}
          persist-credentials: false
      - name: Download immutable image references
        env:
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
        run: |
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" --name release --dir artifact
          grep -Fx "RELEASE_SHA=$RELEASE_SHA" artifact/release.env
          cp artifact/release.env release.env
      - name: Transfer and deploy
        env:
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
        run: |
          set -euo pipefail
          [[ "$DEPLOY_HOST" =~ ^[a-zA-Z0-9.-]+$ ]]
          [[ "$DEPLOY_USER" =~ ^[a-zA-Z0-9_-]+$ ]]
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/atlas_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/atlas_key ~/.ssh/known_hosts
          trap 'rm -f ~/.ssh/atlas_key' EXIT
          tar -czf release.tar.gz compose.production.yaml infra/nginx/api.conf scripts/deploy.sh release.env
          remote="/opt/atlas/releases/$RELEASE_SHA"
          ssh -i ~/.ssh/atlas_key -o BatchMode=yes -o StrictHostKeyChecking=yes "$DEPLOY_USER@$DEPLOY_HOST" "mkdir -p '$remote'"
          scp -i ~/.ssh/atlas_key -o BatchMode=yes -o StrictHostKeyChecking=yes release.tar.gz "$DEPLOY_USER@$DEPLOY_HOST:$remote/release.tar.gz"
          ssh -i ~/.ssh/atlas_key -o BatchMode=yes -o StrictHostKeyChecking=yes "$DEPLOY_USER@$DEPLOY_HOST" "tar -xzf '$remote/release.tar.gz' -C '$remote' && bash '$remote/scripts/deploy.sh' '$remote'"
