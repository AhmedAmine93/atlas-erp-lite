apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: atlas
spec:
  replicas: 1
  selector:
    matchLabels: {app: atlas-backend}
  template:
    metadata:
      labels: {app: atlas-backend}
    spec:
      containers:
        - name: php
          image: atlas-erp-lite-backend:local
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef: {name: atlas-config}
            - secretRef: {name: atlas-secrets}
          ports: [{containerPort: 9000}]
          securityContext: {allowPrivilegeEscalation: false}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: "1", memory: 512Mi}
          livenessProbe:
            tcpSocket: {port: 9000}
            initialDelaySeconds: 10
        - name: nginx
          image: nginxinc/nginx-unprivileged:1.28-alpine
          ports: [{containerPort: 8080}]
          volumeMounts: [{name: nginx-config, mountPath: /etc/nginx/conf.d/default.conf, subPath: default.conf}]
          resources:
            requests: {cpu: 50m, memory: 32Mi}
            limits: {cpu: 250m, memory: 128Mi}
          readinessProbe:
            httpGet: {path: /up, port: 8080}
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: nginx-config
          configMap: {name: atlas-nginx}
---
apiVersion: v1
kind: Service
metadata:
  name: api-web
  namespace: atlas
spec:
  selector: {app: atlas-backend}
  ports: [{port: 80, targetPort: 8080}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: atlas
spec:
  replicas: 1
  selector:
    matchLabels: {app: atlas-frontend}
  template:
    metadata:
      labels: {app: atlas-frontend}
    spec:
      containers:
        - name: next
          image: atlas-erp-lite-frontend:local
          imagePullPolicy: IfNotPresent
          ports: [{containerPort: 3000}]
          securityContext: {allowPrivilegeEscalation: false, runAsNonRoot: true, runAsUser: 1000}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: "1", memory: 512Mi}
          readinessProbe:
            httpGet: {path: /, port: 3000}
            initialDelaySeconds: 5
          livenessProbe:
            tcpSocket: {port: 3000}
            initialDelaySeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: atlas
spec:
  selector: {app: atlas-frontend}
  ports: [{port: 3000, targetPort: 3000}]
